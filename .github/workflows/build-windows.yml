name: Build Windows MSI

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '打包完成后直传 drumbear.cn 并更新软件内更新源: on - 直传'
        default: 'on'
        required: false
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      CCACHE_DISABLE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Trust workspace for git
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/muse"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/muse_deps"

      - name: Configure build
        shell: bash
        run: |
          bash ./buildscripts/ci/tools/make_build_mode_env.sh -e "${{ github.event_name }}" -m stable
          bash ./buildscripts/ci/tools/make_build_number.sh
          echo "BUILD_NUMBER=$(cat ./build.artifacts/env/build_number.env)" >> "$GITHUB_ENV"

      - name: Use pre-installed Qt (self-hosted)
        shell: bash
        run: |
          echo "C:/Qt/6.10.2/msvc2022_64/bin" >> "$GITHUB_PATH"
          echo "CMAKE_PREFIX_PATH=C:/Qt/6.10.2/msvc2022_64" >> "$GITHUB_ENV"

      - name: Setup environment
        shell: cmd
        run: buildscripts\ci\windows\setup.bat

      - name: Download sound fonts
        shell: bash
        run: |
          mkdir -p share/sound
          cd share/sound
          curl -fsSL --retry 3 -o "MS Basic.sf3" "https://drumbear.cn/downloads/soundfonts/MS%20Basic.sf3"
          curl -fsSL --retry 3 -o "FluidR3_GM.sf2" "https://drumbear.cn/downloads/soundfonts/FluidR3_GM.sf2"
          curl -fsSL --retry 3 -o "FluidR3Mono_GM.sf3" "https://drumbear.cn/downloads/soundfonts/FluidR3Mono_GM.sf3"

      - name: Fetch FFmpeg runtime DLLs
        shell: bash
        run: |
          mkdir -p buildscripts/packaging/Windows/ffmpeg
          for f in avcodec-62.dll avformat-62.dll avutil-60.dll swresample-6.dll swscale-9.dll; do
            curl -fsSL --retry 3 "https://drumbear.cn/downloads/ffmpeg/$f" -o "buildscripts/packaging/Windows/ffmpeg/$f"
          done
          ls -lh buildscripts/packaging/Windows/ffmpeg

      - name: Build
        shell: cmd
        run: buildscripts\ci\windows\build.bat -n %BUILD_NUMBER%

      - name: Package
        shell: cmd
        run: buildscripts\ci\windows\package.bat

      - name: Checksum
        shell: bash
        run: bash ./buildscripts/ci/tools/checksum.sh

      - name: Upload artifacts on GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guyuexiong-studio-windows
          path: build.artifacts/
          if-no-files-found: ignore

      - name: Deploy to drumbear.cn
        if: ${{ github.event_name == 'push' || inputs.deploy == 'on' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          UPLOAD_ARTIFACT_NAME: guyuexiong-studio-windows
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_DOWNLOAD_DIR: ${{ vars.DEPLOY_DOWNLOAD_DIR }}
          DEPLOY_UPDATES_DIR: ${{ vars.DEPLOY_UPDATES_DIR }}
          APP_NAME: 鼓乐熊Studio
          OS: windows
        run: bash ./buildscripts/ci/tools/deploy_to_drumbear.sh
